services:
  postgres:
    image: postgres:16
    container_name: rogueduel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rogueduel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
    ports:
      - "5432:5432"
    volumes:
      - rogueduel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: src/RogueDuel.Api/Dockerfile
    container_name: rogueduel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RogueDuelDb: "Host=postgres;Port=5432;Database=rogueduel;Username=postgres;Password=postgres_dev_only"

volumes:
  rogueduel-postgres-data:
